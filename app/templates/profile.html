{% extends "base.html" %}
{% block title %}پروفایل · موجودی من{% endblock %}
{% block content %}
<section class="card auth-card wide">
  <h1>ویرایش موجودی</h1>
  <p class="card-desc">مقادیر دارایی‌های خود را وارد کنید. نقد و خودرو به‌صورت مبلغ تومان ثبت می‌شوند.</p>
  {% if flash %}<p class="toast toast-ok" role="status">{{ flash }}</p>{% endif %}
  {% if error %}<p class="toast toast-warn" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/profile" class="grid-form">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>
      <span class="label-text">طلا ۱۸ عیار (گرم)</span>
      <input name="gold_grams" value="{{ form.gold_grams }}" inputmode="decimal">
    </label>
    <label>
      <span class="label-text">نقره (گرم)</span>
      <input name="silver_grams" value="{{ form.silver_grams }}" inputmode="decimal">
    </label>
    <label>
      <span class="label-text">بیت‌کوین</span>
      <input name="btc" value="{{ form.btc }}" inputmode="decimal">
    </label>
    <label>
      <span class="label-text">کاردانو</span>
      <input name="ada" value="{{ form.ada }}" inputmode="decimal">
    </label>
    <label>
      <span class="label-text">اتریوم</span>
      <input name="eth" value="{{ form.eth }}" inputmode="decimal">
    </label>
    <label>
      <span class="label-text">سولانا</span>
      <input name="sol" value="{{ form.sol }}" inputmode="decimal">
    </label>
    <label>
      <span class="label-text">دوج‌کوین</span>
      <input name="doge" value="{{ form.doge }}" inputmode="decimal">
    </label>
    <label>
      <span class="label-text">پالیگان</span>
      <input name="matic" value="{{ form.matic }}" inputmode="decimal">
    </label>
    <label>
      <span class="label-text">دلار نقد</span>
      <input name="usd" value="{{ form.usd }}" inputmode="decimal">
    </label>
    <label>
      <span class="label-text">نقد (تومان)</span>
      <input name="cash_toman" value="{{ form.cash_toman }}" inputmode="numeric">
    </label>
    <label>
      <span class="label-text">ارزش خودرو (تومان)</span>
      <input name="car_toman" value="{{ form.car_toman }}" inputmode="numeric">
    </label>
    <div class="form-actions span-2">
      <a class="btn btn-ghost" href="/dashboard">انصراف</a>
      <button type="submit" class="btn btn-primary">ذخیره</button>
    </div>
  </form>
</section>
{% endblock %}
