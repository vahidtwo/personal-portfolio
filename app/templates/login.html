{% extends "base.html" %}
{% block title %}ورود · موجودی من{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>ورود به حساب</h1>
  <p class="card-desc">برای مشاهده پرتفوی خود وارد شوید.</p>
  {% if error %}<p class="toast toast-warn" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="stack-form">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>
      <span class="label-text">نام کاربری</span>
      <input name="username" value="{{ form.username }}" autocomplete="username" required>
    </label>
    <label>
      <span class="label-text">رمز عبور</span>
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn btn-primary btn-block">ورود</button>
  </form>
  <p class="muted center">حساب ندارید؟ <a href="/register">ثبت‌نام</a></p>
</section>
{% endblock %}
