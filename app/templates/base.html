<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0c0f14" id="meta-theme-color">
  <title>{% block title %}موجودی من{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main">رفتن به محتوا</a>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="{% if user %}/dashboard{% else %}/{% endif %}">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>موجودی من</span>
      </a>
      <nav class="nav" aria-label="ناوبری اصلی">
        {% if user %}
        <a class="nav-link" href="/dashboard">داشبورد</a>
        <a class="nav-link" href="/profile">پروفایل</a>
        {% if is_admin %}<a class="nav-link" href="/admin">مدیریت</a>{% endif %}
        <form method="post" action="/logout" class="inline">
          <input type="hidden" name="csrf" value="{{ csrf }}">
          <button type="submit" class="btn btn-ghost">خروج</button>
        </form>
        {% else %}
        <a class="nav-link" href="/">معرفی</a>
        <a class="nav-link" href="/login">ورود</a>
        <a class="nav-link nav-link-accent" href="/register">ثبت‌نام</a>
        {% endif %}
        <button type="button" class="btn-icon theme-toggle" id="theme-toggle" aria-label="تغییر پوسته">
          <span class="theme-icon theme-icon-dark" aria-hidden="true">☀</span>
          <span class="theme-icon theme-icon-light" aria-hidden="true">☾</span>
        </button>
      </nav>
    </div>
  </header>
  <main id="main" class="shell">
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">
    <p>قیمت‌ها از <a href="https://chande.net/" rel="noopener noreferrer">چنده</a> · به‌روزرسانی ساعتی</p>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
