services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-in-dokploy}
      HTTPS_ONLY: ${HTTPS_ONLY:-0}
      DATA_DIR: /app/data
      PRICE_REFRESH_HOURS: ${PRICE_REFRESH_HOURS:-1}
      ENABLE_INTERNAL_SCHEDULER: ${ENABLE_INTERNAL_SCHEDULER:-1}
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-}
    volumes:
      - inventory-data:/app/data
    restart: unless-stopped

  # Optional backup if you disable the in-app scheduler (ENABLE_INTERNAL_SCHEDULER=0).
  # cron:
  #   build: .
  #   command: sh -c "while true; do python scripts/create_snapshot.py; sleep 3600; done"
  #   environment:
  #     DATA_DIR: /app/data
  #     SECRET_KEY: ${SECRET_KEY:-change-me-in-dokploy}
  #   volumes:
  #     - inventory-data:/app/data
  #   restart: unless-stopped

  # One-off: docker compose --profile build-android run --rm android-build
  android-build:
    profiles: ["build-android"]
    build:
      context: .
      dockerfile: android/Dockerfile
      target: builder
      args:
        BASE_IMAGE: ${ANDROID_DOCKER_BASE:-hub.hamdocker.ir/eclipse-temurin:17-jdk-jammy}
    image: my-inventory-android-builder
    volumes:
      - ./app/static:/out
    entrypoint:
      [
        "sh",
        "-c",
        "cp /src/android/app/build/outputs/apk/debug/app-debug.apk /out/my-inventory.apk && sha256sum /out/my-inventory.apk",
      ]

volumes:
  inventory-data:
