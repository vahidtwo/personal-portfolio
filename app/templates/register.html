{% extends "base.html" %}
{% block title %}ثبت‌نام / Register{% endblock %}
{% block content %}
<section class="card auth">
  <h1>ثبت‌نام <small>Create account</small></h1>
  {% if error %}<p class="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/register">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>
      نام کاربری / Username
      <input name="username" value="{{ form.username }}" autocomplete="username" required>
    </label>
    <label>
      رمز عبور / Password
      <input type="password" name="password" autocomplete="new-password" required minlength="8">
    </label>
    <button type="submit">ساخت حساب / Register</button>
  </form>
  <p class="muted">قبلاً ثبت‌نام کرده‌اید؟ <a href="/login">ورود / Log in</a></p>
</section>
{% endblock %}
