<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}موجودی من / My Inventory{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/dashboard">موجودی من <span>My Inventory</span></a>
    {% if user %}
    <nav>
      <a href="/dashboard">داشبورد / Dashboard</a>
      <a href="/profile">پروفایل / Profile</a>
      <form method="post" action="/logout" class="inline">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button type="submit">خروج / Log out</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main class="shell">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
